# Labels a pull request by the files it touches (workflow: pr-labeler.yml). The `type:` label comes from
# the title of the pull request instead (workflow: pr-title.yml).

"area: reader":
  - changed-files:
      - any-glob-to-any-file: ["crates/lazer-reader/**"]

"area: api":
  - changed-files:
      - any-glob-to-any-file: ["crates/overlay-server/**", "docs/API.md", "docs/REST_API.md", "docs/WEBSOCKET.md", "docs/DATA_MODEL.md", "src/lib/state/types.ts"]

"area: overlay":
  - changed-files:
      - any-glob-to-any-file: ["src/overlay/**", "src-tauri/src/overlay.rs", "src-tauri/src/rtss.rs"]

"area: editor":
  - changed-files:
      - any-glob-to-any-file: ["src/editor/**", "src/components/ContextMenu.tsx"]

"area: widgets":
  - changed-files:
      - any-glob-to-any-file: ["src/widgets/**", "docs/examples/**", "docs/WIDGETS.md", "docs/BUILTIN_WIDGETS.md"]

"area: ui":
  - changed-files:
      - any-glob-to-any-file: ["src/components/**", "src/App.tsx", "src/index.css", "src/lib/state/store.ts"]

"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "README.md", "src/docs/**", ".github/*.md"]

"area: i18n":
  - changed-files:
      - any-glob-to-any-file: ["src/i18n/**"]

"area: updater":
  - changed-files:
      - any-glob-to-any-file: ["src-tauri/src/updater.rs", "src-tauri/tauri.conf.json", "src/lib/system/updates.ts", "src/components/updates/Update*.tsx", ".github/workflows/release.yml", "scripts/version.mjs", "scripts/build-signed.mjs"]

"area: ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "scripts/**"]

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["package-lock.json", "Cargo.lock"]
