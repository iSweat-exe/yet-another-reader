version: 2

# Dependency updates arrive as pull requests, once a week, in as few of them as possible (grouped), and go through
# the same CI as everything else. Security updates are opened right away regardless of this schedule.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, javascript, skip-changelog]
    commit-message:
      prefix: "chore(deps)"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["vite", "@vitejs/*", "vitest", "typescript", "@tailwindcss/*", "tailwindcss"]
      tauri-js:
        patterns: ["@tauri-apps/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, rust, skip-changelog]
    commit-message:
      prefix: "chore(deps)"
    groups:
      tauri:
        patterns: ["tauri", "tauri-*", "wry", "tao", "webview2-com*", "windows*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github_actions, skip-changelog]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
