name: Stale reports

# Only reports that wait for the author ("status: needs info") are closed when nobody answers. Everything else
# stays open: a bug that nobody fixed yet is still a bug.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Close reports without an answer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          only-labels: "status: needs info"
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            No answer for 14 days, so this report will be closed in a week. Reply here with the details asked
            for (see the comments above) and it stays open.
          close-issue-message: >
            Closed for lack of an answer. Open it again whenever you have the details.
          close-issue-reason: not_planned
