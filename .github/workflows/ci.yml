name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch or pull request replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail on a version of Node the project does not support, instead of a confusing error later.
  NODE_VERSION: "22"

jobs:
  # The names of the jobs are the "required status checks" of .github/rulesets/main.json: rename them together.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # One version for package.json, tauri.conf.json, Cargo.toml and Cargo.lock: the updater compares them.
      - name: Versions agree
        run: node scripts/version.mjs check

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the built interface
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  rust:
    name: Rust (Windows)
    # The reader works on Windows only (it reads the memory of osu!lazer through the .NET DAC).
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The Tauri crate embeds the built interface (`frontendDist`), so it must exist before Rust compiles.
      - run: npm ci
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The release build has its own code (browser shortcuts are switched off natively), so it must compile too.
      - name: Release build compiles
        run: cargo check -p yet-another-reader --release

  # Not a required check yet: it proves the platform boundary (src-tauri/src/platform, lazer-reader's platform
  # module) still compiles without Windows. The reader itself does nothing on Linux yet.
  rust-linux:
    name: Rust (Linux check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Tauri system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Not a required check (see .github/rulesets/main.json): it needs a browser and the sample server, so it is the
  # slowest job, and a flaky browser must not block a merge. It still shows on every pull request.
  e2e:
    name: E2E (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Types of the tests
        run: npx tsc -p e2e

      # Microsoft Edge is on the runner: no browser to download. The config starts Vite and the sample server.
      - name: End-to-end tests
        run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
