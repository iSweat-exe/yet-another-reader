name: Label pull requests

# Adds the `area:` labels from the files a pull request changes (.github/labeler.yml).
# `pull_request_target` so that it can label pull requests from forks too; for that reason this workflow must
# never check out or run the code of the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  labeler:
    name: Label by files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
