[workspace]
resolver = "3"
members = ["src-tauri", "crates/lazer-reader", "crates/overlay-server"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# `tauri dev` builds in the dev profile. The reader scans ~500 MB of the game's memory and
# must stay light next to the game, so its hot loops are optimised even in debug builds.
[profile.dev.package.lazer-reader]
opt-level = 3

[profile.dev.package.rosu-pp]
opt-level = 3
